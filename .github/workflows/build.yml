name: Build

on:
  push:
  pull_request:
  # "Run workflow" button on the Actions page: build without changing any file.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      # Signed with the fixed test key in app/debug.keystore, so test builds update over each other.
      - name: Test APK (debug)
        run: ./gradlew --no-daemon :app:assembleDebug

      # Minified (R8) release build, unsigned: catches shrinking problems. Signed APKs come only
      # from the Release workflow, whose secrets sit behind the owner's approval.
      - name: Release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease

      # Test build for testers (installable).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentSetu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Unsigned: cannot be installed until signed (Release workflow, or Termux per docs/RELEASE.md).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentSetu-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
