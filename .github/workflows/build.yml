name: Build

on:
  push:
  pull_request:
  # "Run workflow" button on the Actions page: build without changing any file.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Release signing on GitHub happens only if the owner has added the release-key secrets
      # (docs/RELEASE.md section 7), and only for builds of main or the "Run workflow" button,
      # never for pull requests.
      SIGN_RELEASE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      # Signed with the fixed test key in app/debug.keystore, so test builds update over each other.
      - name: Test APK (debug)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Load release key from secrets
        if: env.SIGN_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-agentsetu}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > keystore.properties

      # Minified (R8) release build: signed if the key was loaded above, otherwise unsigned.
      - name: Release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Remove release key from the runner
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Name, checksum and certificate of the signed APK
        if: env.SIGN_RELEASE == 'true'
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p signed
          cp app/build/outputs/apk/release/app-release.apk "signed/AgentSetu-v$VERSION.apk"
          (cd signed && sha256sum "AgentSetu-v$VERSION.apk" > "AgentSetu-v$VERSION.apk.sha256")
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "### Signed release AgentSetu-v$VERSION.apk"
            echo '```'
            cat "signed/AgentSetu-v$VERSION.apk.sha256"
            "$APKSIGNER" verify --print-certs "signed/AgentSetu-v$VERSION.apk" | grep -i 'SHA-256'
            echo '```'
            echo "The certificate SHA-256 must match the fingerprint pinned in the WhatsApp group."
          } >> "$GITHUB_STEP_SUMMARY"

      # Test build for testers (installable).
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSetu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.SIGN_RELEASE == 'true'
        with:
          name: AgentSetu-release-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30

      # Without the secrets: unsigned, cannot be installed until the owner signs it (Termux).
      - uses: actions/upload-artifact@v4
        if: env.SIGN_RELEASE != 'true'
        with:
          name: AgentSetu-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
