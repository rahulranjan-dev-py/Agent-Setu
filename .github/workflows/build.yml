name: Build

on:
  push:
  pull_request:
  # "Run workflow" button on the Actions page: build without changing any file.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Unsigned minified (R8) release build. The owner signs it with the release key on their own
      # phone (Termux) or computer (docs/RELEASE.md); the key never comes to GitHub.
      - name: Release build (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease

      # Test build for testers (installable, debug-signed).
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSetu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Unsigned release build: cannot be installed until the owner signs it. Never signed here.
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSetu-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
