name: Promote release

# Turns a published pre-release into a full release: removes the "Pre-release" badge, marks it as
# the latest release, and sets the title to "Agent Setu <version>". Actions -> Promote release ->
# Run workflow, then type the tag (e.g. v1.0.1). Nothing is rebuilt; the attached APK stays as it is.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark as a full, latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v1.0.1"; exit 1;; esac
          gh release view "$TAG" --repo "$REPO" >/dev/null
          gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest --title "Agent Setu ${TAG#v}"
          echo "Promoted $TAG: $(gh release view "$TAG" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
